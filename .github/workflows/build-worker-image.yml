name: Build and push worker image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which worker image to build"
        required: true
        type: choice
        options:
          - qwen
          - h3
      tag:
        description: "Image tag (without repo prefix)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve context and image name
        id: vars
        run: |
          if [ "${{ inputs.image }}" = "qwen" ]; then
            echo "context=runpod-qwen" >> "$GITHUB_OUTPUT"
            echo "image_name=photoreal-qwen-worker" >> "$GITHUB_OUTPUT"
          else
            echo "context=runpod" >> "$GITHUB_OUTPUT"
            echo "image_name=photoreal-h3-worker" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.vars.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.image_name }}:${{ inputs.tag }}
